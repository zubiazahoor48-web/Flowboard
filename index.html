<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flowboard – Task Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tailwind handles layout utilities; preflight is off so it doesn't reset Bootstrap -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } };</script>
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header class="container py-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="h3 fw-bold mb-0">Flowboard</h1>
        <p class="text-secondary mb-0 small" id="summary"></p>
      </div>
      <div class="flex flex-wrap gap-2">
        <input type="search" class="form-control w-auto" id="search" placeholder="Search tasks" aria-label="Search tasks">
        <select class="form-select w-auto" id="priorityFilter" aria-label="Filter by priority">
          <option value="all">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <button class="btn btn-teal" id="addBtn">New task</button>
      </div>
    </div>
  </header>

  <main class="container pb-5">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <section class="column" data-status="todo" aria-labelledby="h-todo">
        <div class="column-head"><h2 class="h6 mb-0" id="h-todo">To do</h2><span class="count" id="count-todo">0</span></div>
        <div class="dropzone" id="list-todo"></div>
      </section>

      <section class="column" data-status="doing" aria-labelledby="h-doing">
        <div class="column-head"><h2 class="h6 mb-0" id="h-doing">In progress</h2><span class="count" id="count-doing">0</span></div>
        <div class="dropzone" id="list-doing"></div>
      </section>

      <section class="column" data-status="done" aria-labelledby="h-done">
        <div class="column-head">
          <h2 class="h6 mb-0" id="h-done">Done</h2>
          <span class="flex items-center gap-2">
            <button class="btn btn-link btn-sm p-0 text-secondary" id="clearDone">Clear done</button>
            <span class="count" id="count-done">0</span>
          </span>
        </div>
        <div class="dropzone" id="list-done"></div>
      </section>

    </div>

    <div class="text-center py-5 d-none" id="emptyBoard">
      <p class="fw-semibold mb-1">Your board is empty</p>
      <p class="text-secondary small mb-3">Create a task, or load sample tasks to see how the board works.</p>
      <button class="btn btn-outline-light btn-sm" id="sampleBtn">Load sample tasks</button>
    </div>
  </main>

  <!-- Add / edit modal -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="taskForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="modalTitle">New task</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="taskId">
          <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input type="text" class="form-control" id="title" maxlength="80" required>
            <div class="invalid-feedback">Give the task a title.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="notes">Notes</label>
            <textarea class="form-control" id="notes" rows="3" maxlength="240"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="form-label" for="priority">Priority</label>
              <select class="form-select" id="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="due">Due date</label>
              <input type="date" class="form-control" id="due">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-teal">Save task</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-body" id="toastMsg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
